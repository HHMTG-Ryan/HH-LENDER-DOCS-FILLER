<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HH – Signing Package Builder</title>

  <!-- Vendor (local copies in ./vendor) -->
  <script src="assets/vendor/pdf-lib.min.js"></script>
  <script src="assets/vendor/jszip.min.js"></script>

  <style>
    /* ========== Light theme (similar to Audit Compiler) ========== */
    :root{
      --bg:#f3f4f6;
      --panel:#ffffff;
      --panel-2:#f9fafb;
      --ink:#111827;
      --muted:#6b7280;
      --brand:#22a366;
      --brand-ink:#064e3b;
      --line:#e5e7eb;
      --ok:#16a34a;
      --warn:#d97706;
      --err:#dc2626;
      --focus:#3b82f6;
      --shadow:0 18px 45px rgba(15,23,42,.10);
    }

    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(59,130,246,.10), transparent 60%),
        radial-gradient(1100px 550px at -10% 110%, rgba(34,197,94,.10), transparent 60%),
        var(--bg);
      color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{
      max-width:960px;
      margin:40px auto;
      padding:0 20px;
    }

    main{
      background:linear-gradient(180deg,rgba(255,255,255,1),rgba(249,250,251,1));
      padding:28px;
      border-radius:20px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }

    /* ========== Header ========== */
    header.top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:10px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }
    .brand img.logo{
      height:36px;
      width:auto;
      display:block;
      flex-shrink:0;
    }
    .brand-text h1{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
    }
    .brand-text .sub{
      margin:4px 0 0;
      color:var(--muted);
      font-size:13px;
    }
    @media(max-width:700px){
      header.top{
        flex-direction:column;
        align-items:flex-start;
      }
    }

    /* ========== Status pill ========== */
    #status{
      display:inline-flex;
      align-items:center;
      padding:8px 13px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(249,250,251,1);
      font-size:13px;
      color:var(--muted);
      margin:16px 0 20px;
    }
    #status.ok{ color:var(--ok); border-color:rgba(34,197,94,.35); }
    #status.warn{ color:var(--warn); border-color:rgba(234,179,8,.35); }
    #status.err{ color:var(--err); border-color:rgba(248,113,113,.5); }

    /* ========== Steps / panels ========== */
    .step{
      margin-top:22px;
      padding:18px 18px 20px;
      border-radius:16px;
      background:linear-gradient(180deg,var(--panel),var(--panel-2));
      border:1px solid var(--line);
    }
    .step h2{
      margin:0 0 14px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:var(--muted);
    }

    /* ========== Grid layout ========== */
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      align-items:flex-start;
    }
    .grid > div{
      min-width:0; /* prevents overlap/squeezing */
    }
    @media(max-width:820px){
      .grid{
        grid-template-columns:1fr;
      }
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    select,
    input[type="file"],
    textarea{
      width:100%;
      box-sizing:border-box;
      background:#f9fafb;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:9px 11px;
      color:var(--ink);
      font:inherit;
    }
    select:focus,
    input[type="file"]:focus,
    textarea:focus{
      border-color:var(--focus);
      box-shadow:0 0 0 3px rgba(59,130,246,.25);
      outline:none;
      background:#ffffff;
    }
    textarea{ resize:vertical; }

    .note{
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
    }

    /* ========== Buttons ========== */
    .btnbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:14px;
    }

    button{
      padding:11px 16px;
      border-radius:12px;
      border:1px solid #d1d5db;
      background:linear-gradient(180deg,#f9fafb,#e5e7eb);
      color:#111827;
      cursor:pointer;
      font:inherit;
      transition:.18s transform,.18s box-shadow,.18s background;
    }
    button:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 22px rgba(15,23,42,.12);
      background:linear-gradient(180deg,#ffffff,#e5e7eb);
    }
    button:active{
      transform:translateY(0);
      box-shadow:none;
    }
    button[disabled]{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
    }

    /* Primary CTA */
    #btnPkg{
      background:linear-gradient(180deg,#22c55e,#16a34a);
      border-color:#16a34a;
      color:#f0fdf4;
      font-weight:600;
    }
    #btnPkg:hover{
      background:linear-gradient(180deg,#4ade80,#16a34a);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main>
      <header class="top">
        <div class="brand">
          <img src="assets/images/hh-logo.png" alt="House & Home Mortgage Co. logo" class="logo">
          <div class="brand-text">
            <h1>HH – Signing Package Builder</h1>
            <p class="sub">Build full signing packages • Generate singles • No uploads • Secure</p>
          </div>
        </div>
      </header>

      <div id="status" class="muted">Loading payload…</div>

      <!-- ========== STEP 1: OPTIONS ========== -->
      <section class="step">
        <h2>Step 1 — Options</h2>
        <div class="grid">
          <div>
            <label for="lender">Lender</label>
            <select id="lender"></select>
          </div>
          <div>
            <label for="pkg">Package Type</label>
            <select id="pkg">
              <option value="Standard">Standard</option>
              <option value="HELOC">HELOC</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ========== STEP 2: UPLOADS ========== -->
      <section class="step">
        <h2>Step 2 — Upload Documents</h2>
        <div class="grid">
          <div>
            <label for="upCommitment">Commitment (required)</label>
            <input type="file" id="upCommitment" accept="application/pdf" />
          </div>
          <div>
            <label for="upApplication">Application (required)</label>
            <input type="file" id="upApplication" accept="application/pdf" />
          </div>
          <div>
            <label for="upMPP">MPP (optional)</label>
            <input type="file" id="upMPP" accept="application/pdf" />
          </div>
          <div id="apaWrap">
            <label for="upAPA">APA (TD only)</label>
            <input type="file" id="upAPA" accept="application/pdf" />
          </div>
          <div style="grid-column:1 / -1;">
            <label for="manualJson">Manual JSON (optional)</label>
            <textarea id="manualJson" rows="6" placeholder='{"Contact_Name":"Ryan Smith","Lender_Name":"TD"}'></textarea>
            <div class="note">Tip: When launched from CRM, this is filled automatically. Paste JSON here only for testing.</div>
          </div>
        </div>
      </section>

      <!-- ========== STEP 3: ACTIONS ========== -->
      <section class="step">
        <h2>Step 3 — Build</h2>
        <div class="btnbar">
          <button id="btnPkg" type="button">Build Signing Package</button>
          <button id="btnSingles" type="button">Generate Editable Singles</button>
          <button id="btnInfo" type="button">Create Info Cover Page</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Path-aware loader for app.js -->
  <script>
    (function(){
      const parts = location.pathname.split('/').filter(Boolean);
      const REPO_BASE = parts.length ? `/${parts[0]}/` : '/';
      const script = document.createElement('script');
      script.src = `${REPO_BASE}assets/js/app.js?v=20251124`;
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
