<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HH – Signing Package Builder</title>

  <!-- Libraries -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" referrerpolicy="no-referrer"></script>

  <style>
    /* ========== Theme (same as Audit Compiler) ========== */
    :root{
      --bg:#0b1220;
      --panel:#0f172a;
      --panel-2:#111827;
      --ink:#e5e7eb;
      --muted:#9ca3af;
      --brand:#22c55e;
      --brand-ink:#052e1b;
      --line:#1f2937;
      --ok:#10b981;
      --warn:#f59e0b;
      --err:#ef4444;
      --focus:#60a5fa;
      --shadow:0 14px 35px rgba(0,0,0,.45);
    }

    body{
      margin:0;
      background:
        radial-gradient(1300px 600px at 100% -10%, rgba(96,165,250,.08), transparent 60%),
        radial-gradient(1100px 500px at -10% 110%, rgba(34,197,94,.08), transparent 60%),
        var(--bg);
      color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    /* ========== Container ========== */
    .wrap{ max-width:960px; margin:40px auto; padding:0 20px; }

    main{
      background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));
      padding:30px;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(6px);
    }

    /* ========== Header ========== */
    header{
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-size:24px;
      letter-spacing:.3px;
    }
    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    /* ========== Status pill ========== */
    #status{
      display:inline-flex;
      align-items:center;
      padding:9px 14px;
      border-radius:999px;
      border:1px solid #243043;
      background:rgba(255,255,255,.03);
      font-size:13px;
      margin:18px 0;
      color:var(--muted);
    }
    #status.ok{ color:var(--ok); border-color:rgba(16,185,129,.45);}
    #status.warn{ color:var(--warn); border-color:rgba(245,158,11,.45);}
    #status.err{ color:var(--err); border-color:rgba(239,68,68,.45);}

    /* ========== Step styling ========== */
    .step{
      margin-top:28px;
      padding:20px;
      border-radius:16px;
      background:linear-gradient(180deg,var(--panel),var(--panel-2));
      border:1px solid var(--line);
    }
    .step h2{
      margin:0 0 14px;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:var(--muted);
    }

    /* ========== Fields & Inputs ========== */
    .grid{ display:grid; gap:16px; grid-template-columns:1fr 1fr; }
    @media(max-width:820px){ .grid{ grid-template-columns:1fr; } }

    label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }

    select,input[type=file],textarea{
      width:100%;
      background:#0b1020;
      border:1px solid #243043;
      border-radius:10px;
      padding:10px 12px;
      color:var(--ink);
    }
    select:focus,input[type=file]:focus,textarea:focus{
      border-color:var(--focus);
      box-shadow:0 0 0 3px rgba(96,165,250,.25);
      outline:none;
    }

    textarea{ resize:vertical; }

    /* ========== Buttons ========== */
    .btnbar{ display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }

    button{
      padding:12px 18px;
      border-radius:12px;
      border:1px solid #243043;
      background:linear-gradient(180deg,#111a2f,#0e172a);
      color:#eef2ff;
      cursor:pointer;
      transition:.2s;
    }
    button:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.25); }
    button:active{ transform:translateY(0); }
    button[disabled]{ opacity:.6; cursor:not-allowed; }

    /* Primary CTA */
    #btnPkg{
      background:linear-gradient(180deg,#1fb86a,#129a56);
      border-color:#1e8449;
      color:#052e1b;
      font-weight:600;
    }

    .note{ color:var(--muted); font-size:12px; margin-top:6px; }

  </style>
</head>

<body>
  <div class="wrap">
    <main>
      <header>
        <h1>HH – Signing Package Builder</h1>
        <p class="sub">Build full signing packages • Generate singles • No uploads • Secure</p>
      </header>

      <div id="status" class="muted">Loading payload…</div>

      <!-- ================= STEP 1 ================= -->
      <section class="step">
        <h2>Step 1 — Options</h2>

        <div class="grid">
          <div>
            <label for="lender">Lender</label>
            <select id="lender"></select>
          </div>

          <div>
            <label for="pkg">Package Type</label>
            <select id="pkg">
              <option value="Standard">Standard</option>
              <option value="HELOC">HELOC</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ================= STEP 2 ================= -->
      <section class="step">
        <h2>Step 2 — Upload Documents</h2>

        <div class="grid">
          <div>
            <label for="upCommitment">Commitment (required)</label>
            <input type="file" id="upCommitment" accept="application/pdf"/>
          </div>

          <div>
            <label for="upApplication">Application (required)</label>
            <input type="file" id="upApplication" accept="application/pdf"/>
          </div>

          <div>
            <label for="upMPP">MPP (optional)</label>
            <input type="file" id="upMPP" accept="application/pdf"/>
          </div>

          <div id="apaWrap">
            <label for="upAPA">APA (TD only)</label>
            <input type="file" id="upAPA" accept="application/pdf"/>
          </div>

          <div style="grid-column:1 / -1;">
            <label for="manualJson">Manual JSON (optional)</label>
            <textarea id="manualJson" rows="6" placeholder='{"Contact_Name":"Ryan"}'></textarea>
            <div class="note">Tip: When launched from CRM, this fills automatically.</div>
          </div>
        </div>
      </section>

      <!-- ================= STEP 3 ================= -->
      <section class="step">
        <h2>Step 3 — Build</h2>

        <div class="btnbar">
          <button id="btnPkg" type="button">Build Signing Package</button>
          <button id="btnSingles" type="button">Generate Editable Singles</button>
          <button id="btnInfo" type="button">Create Info Cover Page</button>
        </div>
      </section>

    </main>
  </div>

  <!-- auto-load path-aware app.js -->
  <script>
    (function(){
      const parts = location.pathname.split('/').filter(Boolean);
      const REPO_BASE = parts.length ? `/${parts[0]}/` : '/';
      const script = document.createElement('script');
      script.src = `${REPO_BASE}assets/js/app.js?v=20251124`;
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
